[project]
name = "pokemon-tcg-ml"
version = "1.0.0"
description = "ML pipeline for Pokemon TCG price prediction, deck ranking, and anomaly detection"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120
target-version = "py310"
